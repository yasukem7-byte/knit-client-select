<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNITPEDIA テーマ選択</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: #f5f5f0;
  color: #333;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

header {
  background: #FEFF82;
  border-bottom: 2px solid #e0e020;
  padding: 14px 20px 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
}

.logo svg { width: 80px; height: auto; display: block; }

.header-title h1 {
  font-family: 'Noto Sans', sans-serif;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.04em;
  color: #222;
  line-height: 1.2;
}

.header-title .sub {
  font-size: 11px;
  color: #666;
  letter-spacing: 0.06em;
  margin-top: 2px;
}

.header-desc {
  font-size: 12px;
  color: #555;
  margin-bottom: 10px;
  padding-left: 2px;
}

.filter-bar {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  padding: 4px 11px;
  border-radius: 14px;
  border: 1.5px solid #bbb;
  background: rgba(255,255,255,0.7);
  color: #555;
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.filter-btn:hover { border-color: #888; color: #333; }
.filter-btn.active { background: #333; color: #FEFF82; border-color: #333; }

.sel-count {
  margin-left: auto;
  font-size: 12px;
  font-weight: 700;
  color: #444;
  white-space: nowrap;
}

main {
  max-width: 860px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}

.section-header {
  font-family: 'Noto Sans', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: #888;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 18px 0 8px;
  border-bottom: 1px solid #ddd;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-count {
  font-size: 11px;
  font-weight: 400;
  color: #aaa;
}

.theme-list { display: flex; flex-direction: column; gap: 3px; }

.theme-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: #fff;
  border: 1.5px solid #e8e8e8;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
}

.theme-item:hover { border-color: #aaa; }

.theme-item.checked {
  background: #f0faf2;
  border-color: #5aaa6a;
}

.cb {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 2px solid #ccc;
  background: #f8f8f8;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  transition: all 0.12s;
  color: #fff;
}

.theme-item.checked .cb {
  background: #5aaa6a;
  border-color: #5aaa6a;
}

.theme-body { flex: 1; min-width: 0; }

.theme-title {
  font-size: 13px;
  line-height: 1.5;
  color: #222;
}

.theme-item.checked .theme-title { color: #2a6a38; }

.theme-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.cat-tag {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 8px;
  font-weight: 500;
  white-space: nowrap;
}

.cat-基礎知識 { background: #eef2fb; color: #3050a0; }
.cat-お手入れ・洗濯 { background: #eef8f2; color: #206040; }
.cat-技術・ものづくり { background: #f4eefb; color: #603090; }
.cat-歴史・文化 { background: #fdf5ec; color: #804020; }
.cat-素材・選び方 { background: #fdf0f4; color: #802040; }
.cat-豆知識・雑学 { background: #f2f8ec; color: #406020; }

.pin-badge {
  font-size: 10px;
  color: #c05020;
  font-weight: 700;
  background: #fff3ee;
  padding: 1px 6px;
  border-radius: 6px;
}

.stars { font-size: 10px; color: #c8a020; letter-spacing: -1px; }

/* FAB */
.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #5aaa6a;
  color: #fff;
  border: none;
  border-radius: 24px;
  padding: 11px 18px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 14px rgba(0,0,0,0.22);
  display: none;
  align-items: center;
  gap: 7px;
  z-index: 300;
  transition: transform 0.15s;
}

.fab:hover { transform: translateY(-2px); }
.fab.visible { display: flex; }

/* selected panel */
.sel-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  border-top: 2px solid #5aaa6a;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  z-index: 200;
}

.sel-panel.open { max-height: 300px; overflow-y: auto; }

.panel-inner { padding: 14px 18px; }

.panel-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  font-weight: 700;
  font-size: 13px;
  color: #2a6a38;
}

.panel-close {
  background: none; border: none;
  font-size: 18px; cursor: pointer; color: #999; padding: 0 4px;
}

.panel-list { display: flex; flex-direction: column; gap: 5px; }

.panel-item {
  display: flex;
  gap: 8px;
  font-size: 12px;
  color: #2a6a38;
  padding: 5px 9px;
  background: #f0faf2;
  border-radius: 5px;
}

.panel-num {
  font-variant-numeric: tabular-nums;
  color: #5aaa6a;
  font-weight: 700;
  min-width: 20px;
  flex-shrink: 0;
}

.saved-toast {
  position: fixed;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #FEFF82;
  padding: 7px 18px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 400;
  white-space: nowrap;
}

.saved-toast.show { opacity: 1; }

.loading { padding: 60px; text-align: center; color: #999; }
.empty { padding: 40px; text-align: center; color: #aaa; }
</style>
</head>

<div class="saved-toast" id="toast">保存しました</div>

const CAT_ORDER=['基礎知識','お手入れ・洗濯','歴史・文化','技術・ものづくり','豆知識・雑学'];
let checked=new Set();
let filter='all';

function load(){
  try{const s=localStorage.getItem('knit-sel');if(s)checked=new Set(JSON.parse(s));}catch(e){}
  render();updateUI();
}

function save(){
  try{localStorage.setItem('knit-sel',JSON.stringify([...checked]));}catch(e){}
}

function toggle(id){
  if(checked.has(id))checked.delete(id);else checked.add(id);
  save();render();updateUI();
  const t=document.getElementById('toast');
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);
}

function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function getFiltered(){
  if(filter==='checked')return THEMES.filter(t=>checked.has(t.id));
  if(filter==='all')return THEMES;
  return THEMES.filter(t=>t.category===filter);
}

function itemHTML(t){
  const c=checked.has(t.id);
  const stars='★'.repeat(t.stars)+'☆'.repeat(3-t.stars);
  return`<div class="theme-item${c?' checked':''}" onclick="toggle(${t.id})">
    <div class="cb">${c?'✓':''}</div>
    <div class="theme-body">
      <div class="theme-title">${t.title}</div>
      <div class="theme-meta">
        <span class="cat-tag cat-${t.category}">${t.category}</span>
        ${t.pinned?'<span class="pin-badge">編集部推薦</span>':''}
        <span class="stars">${stars}</span>
      </div>
    </div>
  </div>`;
}

function render(){
  const items=getFiltered();
  const m=document.getElementById('main');
  if(!items.length){m.innerHTML='<div class="empty">テーマがありません</div>';return;}
  if(filter!=='all'&&filter!=='checked'){
    m.innerHTML=`<div class="theme-list">${items.map(itemHTML).join('')}</div>`;return;
  }
  const pinned=items.filter(t=>t.pinned);
  const byCat={};CAT_ORDER.forEach(c=>byCat[c]=[]);
  items.filter(t=>!t.pinned).forEach(t=>{if(!byCat[t.category])byCat[t.category]=[];byCat[t.category].push(t);});
  let h='';
  if(pinned.length){h+=`<div class="section-header">編集部おすすめ <span class="section-count">${pinned.length}件</span></div><div class="theme-list">${pinned.map(itemHTML).join('')}</div>`;}
  CAT_ORDER.forEach(cat=>{
    const its=byCat[cat];if(!its||!its.length)return;
    h+=`<div class="section-header">${cat} <span class="section-count">${its.length}件</span></div><div class="theme-list">${its.map(itemHTML).join('')}</div>`;
  });
  m.innerHTML=h;
}

function updateUI(){
  const n=checked.size;
  document.getElementById('selCount').textContent=n?`${n}件 選択中`:'';
  document.getElementById('fabN').textContent=n;
  const fab=document.getElementById('fab');
  if(n>0)fab.classList.add('visible');else{fab.classList.remove('visible');document.getElementById('selPanel').classList.remove('open');}
  const sel=THEMES.filter(t=>checked.has(t.id));
  document.getElementById('panelList').innerHTML=sel.map((t,i)=>`<div class="panel-item"><span class="panel-num">${i+1}</span><span>${t.title}</span></div>`).join('');
}

function togglePanel(){document.getElementById('selPanel').classList.toggle('open');}

load();
</script>
