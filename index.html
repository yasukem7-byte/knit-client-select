  --checked-bg: #EBF4E8;
  --checked-border: #4A8A5A;
  --checked-text: #2A5A35;

  --tag-基礎知識-text: #2A3F7A;

  --tag-素材・選び方-text: #7A1A3A;

}

  :root:not([data-theme="light"]) {
    --bg: #181512;
    --surface: #211E1A;
    --surface2: #2A2620;
    --border: #3A342C;
    --text: #EDE8E2;
    --text-muted: #9A9088;
    --accent: #5A9ADA;
    --accent-light: #1A2A3A;
    --checked-bg: #1A2E1A;
    --checked-border: #4A8A5A;
    --checked-text: #7ACA8A;
    --tag-基礎知識: #1A2040;
    --tag-基礎知識-text: #8AAAEA;
    --tag-お手入れ・洗濯: #1A2A20;
    --tag-お手入れ・洗濯-text: #7ACAA0;
    --tag-技術・ものづくり: #221A35;
    --tag-技術・ものづくり-text: #AA8AEA;
    --tag-歴史・文化: #2A1E10;
    --tag-歴史・文化-text: #DAA07A;
    --tag-素材・選び方: #2A1020;
    --tag-素材・選び方-text: #DA8AAA;
    --tag-豆知識・雑学: #1A2210;
    --tag-豆知識・雑学-text: #AACA7A;
  }
}

:root[data-theme="dark"] {
  --bg: #181512;
  --surface: #211E1A;
  --surface2: #2A2620;
  --border: #3A342C;
  --text: #EDE8E2;
  --text-muted: #9A9088;
  --accent: #5A9ADA;
  --accent-light: #1A2A3A;
  --checked-bg: #1A2E1A;
  --checked-border: #4A8A5A;
  --checked-text: #7ACA8A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

header {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 20px 24px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 4px;
}

.header-logo {
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  color: var(--accent);
  letter-spacing: 0.05em;
}

.header-sub {
  font-size: 12px;
  color: var(--text-muted);
}

.header-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 14px;
}

.filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); color: #FFF; border-color: var(--accent); }

.selected-count {
  margin-left: auto;
  font-size: 13px;
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
}

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

.section-header {
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  padding: 20px 0 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-count {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  opacity: 0.7;
}

.theme-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }

.theme-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}

.theme-item:hover { border-color: var(--accent); }

.theme-item.checked {
  background: var(--checked-bg);
  border-color: var(--checked-border);
}

.theme-checkbox {
  width: 20px;
  height: 20px;
  border-radius: 5px;
  border: 2px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  margin-top: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 13px;
}

.theme-item.checked .theme-checkbox {
  background: var(--checked-border);
  border-color: var(--checked-border);
  color: #FFF;
}

.theme-body { flex: 1; min-width: 0; }

.theme-title {
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text);
  word-break: break-all;
}

.theme-item.checked .theme-title { color: var(--checked-text); font-weight: 500; }

.theme-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
}

.cat-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
  white-space: nowrap;
}

.pin-badge {
  font-size: 11px;
  color: var(--pin-color);
  font-weight: 700;
  letter-spacing: 0.03em;
}

.stars {
  font-size: 11px;
  color: var(--star-color);
  letter-spacing: -1px;
}

/* selected panel */
.selected-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface2);
  border-top: 2px solid var(--checked-border);
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, padding 0.3s ease;
  z-index: 200;
}

.selected-panel.open {
  max-height: 320px;
  padding: 16px 20px;
  overflow-y: auto;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--checked-text);
}

.panel-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 0 4px;
}

.panel-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.panel-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  color: var(--checked-text);
  padding: 6px 10px;
  background: var(--checked-bg);
  border-radius: 6px;
}

.panel-item-num {
  font-variant-numeric: tabular-nums;
  color: var(--checked-border);
  font-weight: 700;
  font-size: 11px;
  padding-top: 2px;
  flex-shrink: 0;
  min-width: 22px;
}

.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--checked-border);
  color: #FFF;
  border: none;
  border-radius: 28px;
  padding: 12px 20px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  display: none;
  align-items: center;
  gap: 8px;
  z-index: 300;
  transition: transform 0.15s;
}

.fab:hover { transform: translateY(-2px); }
.fab.visible { display: flex; }

.empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }

.loading { padding: 60px; text-align: center; color: var(--text-muted); }

.saved-msg {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--checked-border);
  color: #FFF;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 400;
}
.saved-msg.show { opacity: 1; }
</style>

<div class="saved-msg" id="savedMsg">選択を保存しました</div>

<header>
  <div class="header-top">
    <span class="header-logo">KNITPEDIA</span>
    <span class="header-sub">記事テーマ選択</span>
  </div>
  <p class="header-desc">気になるテーマにチェックを入れてください。選択内容は自動で保存されます。</p>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all')">すべて</button>
    <button class="filter-btn" onclick="setFilter('checked')">選択済み</button>
    <button class="filter-btn" onclick="setFilter('基礎知識')">基礎知識</button>
    <button class="filter-btn" onclick="setFilter('お手入れ・洗濯')">お手入れ</button>
    <button class="filter-btn" onclick="setFilter('技術・ものづくり')">技術</button>
    <button class="filter-btn" onclick="setFilter('歴史・文化')">歴史</button>
    <button class="filter-btn" onclick="setFilter('素材・選び方')">素材</button>
    <button class="filter-btn" onclick="setFilter('豆知識・雑学')">豆知識</button>
    <span class="selected-count" id="selCount"></span>
  </div>
</header>

<main id="mainContent">
  <div class="loading">テーマを読み込み中...</div>
</main>

<button class="fab" id="fab" onclick="togglePanel()">
  <span>✓</span>
  <span id="fabCount">0</span>件 選択中
</button>

<div class="selected-panel" id="selPanel">
  <div class="panel-header">
    選択したテーマ <button class="panel-close" onclick="togglePanel()">×</button>
  </div>
  <div class="panel-list" id="panelList"></div>
</div>

const CAT_ORDER = ['基礎知識','お手入れ・洗濯','素材・選び方','技術・ものづくり','歴史・文化','豆知識・雑学'];
let checkedIds = new Set();
let currentFilter = 'all';
let db = null;

async function init() {
  try {
    db = await claude.use('db');
    if (db) {
      const doc = await db.doc('client/selections').get();
      if (doc.exists) {
        checkedIds = new Set(doc.data().ids || []);
      }
      db.doc('client/selections').onSnapshot(snap => {
        if (snap.exists) {
          checkedIds = new Set(snap.data().ids || []);
          render();
          updateUI();
        }
      });
    }
  } catch(e) {}
  render();
  updateUI();
}

async function toggle(id) {
  if (checkedIds.has(id)) checkedIds.delete(id);
  else checkedIds.add(id);
  updateUI();
  render();
  if (db) {
    try {
      await db.doc('client/selections').set({ ids: [...checkedIds] });
      showSaved();
    } catch(e) {}
  }
}

function showSaved() {
  const m = document.getElementById('savedMsg');
  m.classList.add('show');
  setTimeout(() => m.classList.remove('show'), 1800);
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function getFiltered() {
  if (currentFilter === 'checked') return THEMES.filter(t => checkedIds.has(t.id));
  if (currentFilter === 'all') return THEMES;
  return THEMES.filter(t => t.category === currentFilter);
}

function catStyle(cat) {
  const safe = cat.replace(/[^a-zA-Z　-鿿゠-ヿ぀-ゟ・]/g,'');
  return `background:var(--tag-${cat});color:var(--tag-${cat}-text,#555)`;
}

function render() {
  const filtered = getFiltered();
  const main = document.getElementById('mainContent');

  if (filtered.length === 0) {
    main.innerHTML = '<div class="empty">テーマがありません</div>';
    return;
  }

  if (currentFilter !== 'all' && currentFilter !== 'checked') {
    main.innerHTML = renderList(filtered);
    return;
  }

  // Group by category
  const pinned = filtered.filter(t => t.pinned);
  const byCat = {};
  CAT_ORDER.forEach(c => byCat[c] = []);
  filtered.filter(t => !t.pinned).forEach(t => {
    if (!byCat[t.category]) byCat[t.category] = [];
    byCat[t.category].push(t);
  });

  let html = '';
  if (pinned.length) {
    html += `<div class="section-header">編集部おすすめ <span class="section-count">${pinned.length}件</span></div>`;
    html += `<div class="theme-list">${pinned.map(itemHTML).join('')}</div>`;
  }
  CAT_ORDER.forEach(cat => {
    const items = byCat[cat];
    if (!items || !items.length) return;
    html += `<div class="section-header">${cat} <span class="section-count">${items.length}件</span></div>`;
    html += `<div class="theme-list">${items.map(itemHTML).join('')}</div>`;
  });
  main.innerHTML = html;
}

function renderList(items) {
  return `<div class="theme-list">${items.map(itemHTML).join('')}</div>`;
}

function itemHTML(t) {
  const checked = checkedIds.has(t.id);
  const stars = '★'.repeat(t.stars) + '☆'.repeat(3 - t.stars);
  return `<div class="theme-item${checked?' checked':''}" onclick="toggle(${t.id})">
    <div class="theme-checkbox">${checked?'✓':''}</div>
    <div class="theme-body">
      <div class="theme-title">${t.title}</div>
      <div class="theme-meta">
        <span class="cat-tag" style="${catStyle(t.category)}">${t.category}</span>
        ${t.pinned?'<span class="pin-badge">編集部推薦</span>':''}
        <span class="stars">${stars}</span>
      </div>
    </div>
  </div>`;
}

function updateUI() {
  const n = checkedIds.size;
  document.getElementById('selCount').textContent = n ? `${n}件 選択中` : '';
  document.getElementById('fabCount').textContent = n;
  const fab = document.getElementById('fab');
  if (n > 0) fab.classList.add('visible');
  else { fab.classList.remove('visible'); document.getElementById('selPanel').classList.remove('open'); }
  // update panel
  const list = document.getElementById('panelList');
  const sel = THEMES.filter(t => checkedIds.has(t.id));
  list.innerHTML = sel.map((t,i) => `<div class="panel-item"><span class="panel-item-num">${i+1}</span><span>${t.title}</span></div>`).join('');
}

function togglePanel() {
  document.getElementById('selPanel').classList.toggle('open');
}

init();
</script>
